name: Call Reusable Build Workflow

on:
    push:
        branches: [main]

jobs:
    build:
        uses: ./.github/workflows/Day-46-reusable.yml
        with: 
            app_name: "my-web-app"
            environment: "production"
        secrets: 
            docker_token: ${{ secrets.DOCKER_TOKEN }}

    print-version:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name:  Print Build Verion
              run: echo "Build Version is ${{ needs.build.outputs.build_version }}"

